<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>법규 간이 계산기 · 아키노션</title><style>:root{--ink:#2C2C2B;--mut:rgba(44,44,43,.55);--line:rgba(44,44,43,.12);--bg:#F4F3F0;
--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Helvetica,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
--serif:Lyon-Text,Georgia,"Nanum Myeongjo",NanumMyeongjo,Batang,"Hiragino Mincho ProN","Hiragino Mincho Pro",serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;font-family:var(--sans);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
html.serif body{font-family:var(--serif)}
.blk{margin:4px;height:calc(100% - 8px);background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:22px}
.tt{font-size:14px;font-weight:600}.tt:before{content:'';display:inline-block;width:7px;height:7px;background:var(--ink);border-radius:1.5px;margin-right:7px;vertical-align:2px}
.sub{font-size:12px;color:var(--mut);font-weight:400}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:#fff;border-radius:4px;padding:2px 8px;font-size:12px;color:var(--ink);font-weight:500}
.chip:hover{background:var(--bg)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
input,select{font:inherit;font-size:14px;font-weight:400;border:1px solid var(--line);border-radius:4px;padding:4px 7px;background:var(--bg);color:var(--ink);outline:none;width:100%;height:30px}
input:focus,select:focus{border-color:rgba(44,44,43,.45)}
.num{font-weight:400;font-variant-numeric:tabular-nums}
.lab{font-size:12px;color:var(--mut);margin-bottom:3px}
.note{font-size:11px;color:var(--mut);margin-top:auto;padding-top:8px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}.o{background:var(--bg);border-radius:4px;padding:8px 10px}.o .v{font-size:20px;line-height:1.2}.o .k{font-size:11px;color:var(--mut)}.o.warn{background:var(--ink);color:#fff}.o.warn .k{color:rgba(255,255,255,.65)}</style><script>(function(){var q=new URLSearchParams(location.search),b=q.get('bg');if(b&&/^[0-9a-fA-F]{6}$/.test(b))document.documentElement.style.background='#'+b;if(q.get('font')==='serif')document.documentElement.classList.add('serif');})()</script></head><body>
<div class="blk"><div class="hd"><div class="tt">법규 간이 계산기</div><div class="sub">건폐율 · 용적률</div></div>
<div class="g"><div><div class="lab">대지면적 (㎡)</div><input id="a" inputmode="decimal" value="330"></div>
<div><div class="lab">용도지역</div><select id="z"></select></div>
<div><div class="lab">건폐율 (%)</div><input id="bc" inputmode="decimal"></div>
<div><div class="lab">용적률 (%)</div><input id="far" inputmode="decimal"></div>
<div><div class="lab">층고 (m)</div><input id="fh" inputmode="decimal" value="3.3"></div></div>
<div class="out" id="out"></div>
<div class="note">용도지역 값은 국토계획법 시행령 상한입니다. 조례·지구단위계획으로 더 낮을 수 있으니 토지이음에서 확인하세요. 지하층·주차 등 용적률 제외 면적은 반영하지 않았습니다.</div></div>
<script>
const Z=[['직접 입력',null,null],['제1종전용주거',50,100],['제2종전용주거',50,150],['제1종일반주거',60,200],['제2종일반주거',60,250],['제3종일반주거',50,300],['준주거',70,500],['중심상업',90,1500],['일반상업',80,1300],['근린상업',70,900],['유통상업',80,1100],['전용공업',70,300],['일반공업',70,350],['준공업',70,400],['보전녹지',20,80],['생산녹지',20,100],['자연녹지',20,100]];
const $=i=>document.getElementById(i);Z.forEach((z,i)=>{const o=document.createElement('option');o.value=i;o.textContent=z[0]+(z[1]?' ('+z[1]+'/'+z[2]+')':'');$('z').appendChild(o)});$('z').value=4;
$('z').onchange=()=>{const z=Z[+$('z').value];if(z[1]){$('bc').value=z[1];$('far').value=z[2]}calc()};
const r=n=>Math.round(n*10)/10;
function calc(){const a=+$('a').value,bc=+$('bc').value,far=+$('far').value,fh=+$('fh').value;const ba=a*bc/100,ga=a*far/100,fl=ba>0?Math.ceil(ga/ba-1e-9):0;
$('out').innerHTML=[['최대 건축면적',r(ba)+'㎡'],['최대 연면적',r(ga)+'㎡'],['건폐율 꽉 채울 때',fl+'층'],['예상 높이',r(fl*fh)+'m']].map(x=>'<div class="o"><div class="k">'+x[0]+'</div><div class="v num">'+x[1]+'</div></div>').join('')}
['a','bc','far','fh'].forEach(i=>$(i).oninput=calc);$('z').onchange();
</script></body></html>
