<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D-day · 아키노션</title><style>@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{--ink:#37352F;--bg:#EFEDE8;--mut:#8b877f;--line:#d9d6cf}
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink)}
.blk{position:relative;margin:16px 10px 10px 20px;background:#fff;border:2.5px solid var(--ink);border-radius:5px;padding:14px 16px}
.blk:before{content:'';position:absolute;left:-12px;top:-11px;width:10px;bottom:6px;background:var(--ink);clip-path:polygon(0 0,100% 9px,100% 100%,0 calc(100% - 9px));}
.blk:after{content:'';position:absolute;left:-12px;top:-11px;right:4px;height:10px;background:var(--ink);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 100%,12px 100%);}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tt{font-family:'Black Han Sans',sans-serif;font-size:17px;letter-spacing:.5px}
.sub{font-size:11px;color:var(--mut)}
button{font:inherit;cursor:pointer}
.chip{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
input,select{font:inherit;border:1.5px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);outline:none;width:100%}
input:focus,select:focus{border-color:var(--ink)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.it{background:var(--bg);border-radius:6px;padding:10px 12px}
.nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dd{font-family:'Black Han Sans';font-size:30px;line-height:1.1;margin-top:2px}.dt{font-size:11px;color:var(--mut)}
.it.hot{background:var(--ink);color:#fff}.it.hot .dt{color:#cfcac0}.it.past{opacity:.45}
.ed{display:none;margin-top:10px}.ed.on{display:block}.er{display:grid;grid-template-columns:1fr 130px 26px;gap:6px;margin-bottom:6px}.x{border:none;background:none;font-size:16px;color:var(--mut)}
.acts{display:flex;gap:6px;margin-top:6px}.empty{font-size:12px;color:var(--mut)}@media (max-width:300px){.blk{margin:12px 4px 6px 15px;padding:10px 10px}.tt{font-size:15px}.sub{display:none}.chip{padding:2px 8px;font-size:11px}.dd{font-size:24px}.tm{font-size:34px}.list{grid-template-columns:1fr!important;gap:6px}.it{padding:7px 10px}.scales{gap:4px;margin-bottom:8px}.unit select{width:58px}input,select{padding:5px 6px;font-size:13px}.lab{margin-bottom:2px}.ctl{gap:4px}.stat .sq{width:10px;height:10px}.hd{margin-bottom:8px;gap:6px}}
html,body{overflow:hidden}</style><script>(function(){var b=new URLSearchParams(location.search).get('bg');if(b&&/^[0-9a-fA-F]{6}$/.test(b)){document.documentElement.style.background='#'+b;}})()</script></head><body>
<div class="blk"><div class="hd"><div class="tt">D-day</div><button class="chip" id="eb">편집</button></div>
<div class="list" id="list"></div><div class="ed" id="ed"><div id="rows"></div><div class="acts"><button class="chip" id="add">+ 추가</button><button class="chip on" id="save">저장</button><button class="chip" id="cp">링크 복사</button></div><div class="sub" id="msg" style="margin-top:6px"></div></div></div>
<script>
const P=new URLSearchParams(location.search);const KEY='an-dday-'+(P.get('id')||'default');
let items=[];for(let i=1;i<=6;i++){const t=P.get('t'+i)||(i===1?P.get('t'):null),d=P.get('d'+i)||(i===1?P.get('d'):null);if(t&&d)items.push({t,d})}
if(!items.length){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}}
if(!items.length)items=[{t:'중간 크리틱',d:''},{t:'최종 발표',d:''}];
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
function diff(d){const [y,m,dd]=d.split('-').map(Number);return Math.round((new Date(y,m-1,dd)-today())/864e5)}
function render(){const L=document.getElementById('list');L.innerHTML='';const v=items.filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d));
if(!v.length){L.innerHTML='<div class="empty">편집을 눌러 마감일을 넣어 주세요.</div>';return}
v.forEach(x=>{const n=diff(x.d);const e=document.createElement('div');e.className='it'+(n>=0&&n<=3?' hot':'')+(n<0?' past':'');e.innerHTML='<div class="nm"></div><div class="dd">'+(n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n))+'</div><div class="dt">'+x.d.replace(/-/g,'.')+'</div>';e.querySelector('.nm').textContent=x.t;L.appendChild(e)})}
function rows(){const R=document.getElementById('rows');R.innerHTML='';items.forEach((x,i)=>{const r=document.createElement('div');r.className='er';r.innerHTML='<input placeholder="이름"><input type="date"><button class="x">×</button>';const [a,b,c]=r.children;a.value=x.t;b.value=x.d;a.oninput=()=>x.t=a.value;b.oninput=()=>x.d=b.value;c.onclick=()=>{items.splice(i,1);rows()};R.appendChild(r)})}
document.getElementById('eb').onclick=()=>{const e=document.getElementById('ed');e.classList.toggle('on');rows()};
document.getElementById('add').onclick=()=>{if(items.length<6){items.push({t:'',d:''});rows()}};
document.getElementById('save').onclick=()=>{items=items.filter(x=>x.t&&x.d);try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}render();document.getElementById('ed').classList.remove('on')};
document.getElementById('cp').onclick=async()=>{const u=new URL(location.href.split('?')[0]);items.filter(x=>x.t&&x.d).forEach((x,i)=>{u.searchParams.set('t'+(i+1),x.t);u.searchParams.set('d'+(i+1),x.d)});const m=document.getElementById('msg');try{await navigator.clipboard.writeText(u.toString());m.textContent='복사했어요. 노션 임베드 주소를 이 링크로 바꾸면 모든 기기에서 같게 보여요.'}catch(e){m.textContent=u.toString()}};
render();setInterval(render,6e4);
</script></body></html>
