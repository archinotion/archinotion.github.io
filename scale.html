<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>축척 계산기 · 아키노션</title><style>:root{--ink:#2C2C2B;--mut:rgba(44,44,43,.55);--line:rgba(44,44,43,.12);--bg:#F4F3F0;
--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Helvetica,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
--serif:Lyon-Text,Georgia,"Nanum Myeongjo",NanumMyeongjo,Batang,"Hiragino Mincho ProN","Hiragino Mincho Pro",serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:transparent;font-family:var(--sans);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
html.serif body{font-family:var(--serif)}
.blk{margin:4px;height:calc(100% - 8px);background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:22px}
.tt{font-size:14px;font-weight:600}.tt:before{content:'';display:inline-block;width:7px;height:7px;background:var(--ink);border-radius:1.5px;margin-right:7px;vertical-align:2px}
.sub{font-size:12px;color:var(--mut);font-weight:400}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:#fff;border-radius:4px;padding:2px 8px;font-size:12px;color:var(--ink);font-weight:500}
.chip:hover{background:var(--bg)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
input,select{font:inherit;font-size:14px;font-weight:400;border:1px solid var(--line);border-radius:4px;padding:4px 7px;background:var(--bg);color:var(--ink);outline:none;width:100%;height:30px}
input:focus,select:focus{border-color:rgba(44,44,43,.45)}
.num{font-weight:400;font-variant-numeric:tabular-nums}
.lab{font-size:12px;color:var(--mut);margin-bottom:3px}
.note{font-size:11px;color:var(--mut);margin-top:auto;padding-top:8px}.scales{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}.ssel{display:none;width:96px;height:26px;font-size:12px;padding:2px 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.unit{display:flex;gap:5px}.unit input{flex:1;min-width:0}.unit select{width:60px;flex:none}
@media (max-width:440px){.scales,.wide{display:none}.ssel{display:block}.row{grid-template-columns:1fr;gap:6px}.lr{display:grid;grid-template-columns:34px 1fr;align-items:center}.lr .lab{margin:0}}/*nw*/.chip,.tt{white-space:nowrap}@media (max-width:330px){.blk{padding:10px 10px}.hd{margin-bottom:8px}.sub{display:none}}/*sn*/@media (max-width:300px){.ssel{width:74px}.unit select{width:50px}.lr{grid-template-columns:1fr}.lr .lab{margin-bottom:2px}.note{display:none}}@media (max-width:200px){.tt:before{display:none}.tt{font-size:13px}.hd{flex-wrap:wrap}.ssel{width:100%}}</style><script>(function(){var q=new URLSearchParams(location.search),b=q.get('bg');if(b&&/^[0-9a-fA-F]{6}$/.test(b))document.documentElement.style.background='#'+b;if(q.get('font')==='serif')document.documentElement.classList.add('serif');})()</script></head><body>
<div class="blk"><div class="hd"><div class="tt">축척 계산기</div><select class="ssel" id="ss"></select><div class="sub wide">실제 ⇄ 도면·모형</div></div>
<div class="scales" id="sc"></div>
<div class="row"><div class="lr"><div class="lab">실제</div><div class="unit"><input id="real" inputmode="decimal" value="3"><select id="ru"><option>mm</option><option>cm</option><option selected>m</option></select></div></div>
<div class="lr"><div class="lab">도면</div><div class="unit"><input id="draw" inputmode="decimal"><select id="du"><option selected>mm</option><option>cm</option></select></div></div></div>
<div class="note" id="res"></div></div>
<script>
const S=[20,50,100,200,300,500,1000];const U={mm:1,cm:10,m:1000};let k=+(new URLSearchParams(location.search).get('s')||100);
const $=i=>document.getElementById(i),sc=$('sc'),ss=$('ss'),real=$('real'),draw=$('draw'),ru=$('ru'),du=$('du'),res=$('res');
S.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent='1:'+s;ss.appendChild(o)});ss.onchange=()=>{k=+ss.value;chips();fromReal()};
function chips(){ss.value=k;sc.innerHTML='';S.forEach(s=>{const b=document.createElement('button');b.className='chip'+(s===k?' on':'');b.textContent='1:'+s;b.onclick=()=>{k=s;chips();fromReal()};sc.appendChild(b)})}
const f=n=>Math.round(n*100)/100;
function fromReal(){const r=parseFloat(real.value);if(isNaN(r)){draw.value='';return}draw.value=f(r*U[ru.value]/k/U[du.value]);note()}
function fromDraw(){const d=parseFloat(draw.value);if(isNaN(d)){real.value='';return}real.value=f(d*U[du.value]*k/U[ru.value]);note()}
function note(){res.textContent='1:'+k+' · 도면 1mm = 실제 '+f(k/1000)+'m'}
real.oninput=fromReal;ru.onchange=fromReal;draw.oninput=fromDraw;du.onchange=fromReal;chips();fromReal();
</script></body></html>
